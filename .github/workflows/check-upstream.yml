name: Check upstream for new releases

on:
  schedule:
    - cron: "23 6 * * *" # daily at 06:23 UTC
  workflow_dispatch:

concurrency:
  group: check-upstream
  cancel-in-progress: false

jobs:
  check-upstream:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          # Use the PAT so pushes and releases made here trigger other workflows.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Update xremap.spec if upstream published a newer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream=$(gh api repos/xremap/xremap/releases/latest --jq '.tag_name')
          upstream="${upstream#v}"
          current=$(awk '/^Version:/ {print $2}' xremap.spec)
          echo "Upstream version: $upstream — packaged version: $current"

          newest=$(printf '%s\n%s\n' "$current" "$upstream" | sort -V | tail -n1)
          if [ "$upstream" != "$current" ] && [ "$newest" = "$upstream" ]; then
            ./scripts/update-spec-version.sh "$upstream"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add xremap.spec
            git commit -m "Update xremap to upstream version $upstream"
            git push
          else
            echo "Packaged version is up to date."
          fi

      - name: Publish a release for the packaged version if missing
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          version=$(awk '/^Version:/ {print $2}' xremap.spec)
          release=$(awk '/^Release:/ {print $2}' xremap.spec | sed 's/%.*//')
          tag="$version-$release"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists — nothing to do."
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --notes "Fedora RPM packages for xremap upstream version $version."
          fi
